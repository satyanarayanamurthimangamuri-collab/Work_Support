<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#F8FAF9" stroke="#1E4F8A" stroke-width="2"/>
  
  <!-- Supporting hand curve at bottom -->
  <path d="M 40 150 Q 100 180 160 150" stroke="#6B4CAA" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Left figure (teal) -->
  <g>
    <!-- Head -->
    <circle cx="70" cy="60" r="12" fill="#1B7A8F"/>
    <!-- Body -->
    <rect x="63" y="75" width="14" height="25" fill="#1B7A8F" rx="2"/>
    <!-- Left arm up -->
    <rect x="48" y="80" width="15" height="12" fill="#1B7A8F" transform="rotate(-35 55 86)" rx="6"/>
    <!-- Right arm extended -->
    <rect x="77" y="82" width="18" height="12" fill="#1B7A8F" transform="rotate(20 86 88)" rx="6"/>
    <!-- Left leg -->
    <rect x="63" y="100" width="8" height="20" fill="#1B7A8F" rx="4"/>
    <!-- Right leg -->
    <rect x="72" y="100" width="8" height="20" fill="#1B7A8F" rx="4"/>
    <!-- Backpack -->
    <rect x="55" y="75" width="12" height="30" fill="#0D5A7A" rx="2" opacity="0.8"/>
  </g>
  
  <!-- Right figure (orange) -->
  <g>
    <!-- Head -->
    <circle cx="130" cy="55" r="12" fill="#FF9800"/>
    <!-- Body -->
    <rect x="123" y="70" width="14" height="28" fill="#FF9800" rx="2"/>
    <!-- Left arm up helping -->
    <rect x="113" y="72" width="16" height="12" fill="#FF9800" transform="rotate(-25 121 78)" rx="6"/>
    <!-- Right arm up -->
    <rect x="137" y="72" width="16" height="12" fill="#FF9800" transform="rotate(35 145 78)" rx="6"/>
    <!-- Left leg -->
    <rect x="123" y="98" width="8" height="20" fill="#FF9800" rx="4"/>
    <!-- Right leg -->
    <rect x="132" y="98" width="8" height="20" fill="#FF9800" rx="4"/>
    <!-- Backpack -->
    <circle cx="147" cy="75" r="10" fill="#FFA500"/>
    <circle cx="150" cy="72" r="8" fill="#FFA500"/>
  </g>
  
  <!-- Stars (growth/achievement) -->
  <g fill="#4CAF50">
    <polygon points="95,35 98,43 106,43 99,49 102,57 95,51 88,57 91,49 84,43 92,43"/>
    <polygon points="110,32 112,38 118,38 113,42 115,48 110,44 105,48 107,42 102,38 108,38"/>
  </g>
  <g fill="#6B4CAA">
    <polygon points="125,45 127,51 133,51 128,55 130,61 125,57 120,61 122,55 117,51 123,51"/>
  </g>
  
  <!-- Connecting line showing support -->
  <line x1="86" y1="82" x2="113" y2="75" stroke="#1E4F8A" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
</svg>